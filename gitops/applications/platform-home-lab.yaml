apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-home-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TechOpsT/Enterprise-Platform-Lab.git
    targetRevision: main
    path: charts/platform-home-lab
    helm:
      releaseName: platform-home-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
