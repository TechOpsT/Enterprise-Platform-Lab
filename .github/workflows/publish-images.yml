name: Publish container images

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/frontend/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/techopst/platform-api:latest
            ghcr.io/techopst/platform-api:${{ github.sha }}

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/techopst/platform-web:latest
            ghcr.io/techopst/platform-web:${{ github.sha }}
  promote:
    name: Promote image version to GitOps
    needs:
      - publish-api
      - publish-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Helm image tags
        run: |
          sed -i '/repository: ghcr.io\/techopst\/platform-api/{n;s/tag: .*/tag: ${{ github.sha }}/;}' charts/platform-home-lab/values.yaml
          sed -i '/repository: ghcr.io\/techopst\/platform-web/{n;s/tag: .*/tag: ${{ github.sha }}/;}' charts/platform-home-lab/values.yaml

      - name: Commit promoted image version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/platform-home-lab/values.yaml
          git diff --cached --quiet || git commit -m "Promote images for ${{ github.sha }}"
          git push           