namespace: platform-lab

api:
  replicaCount: 2
  image:
    repository: ghcr.io/techopst/platform-api
    tag: ecc3ad666a49d148143634ef7f0cacb6fe1aecfd
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/techopst/platform-web
    tag: ecc3ad666a49d148143634ef7f0cacb6fe1aecfd
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  database: platform
  username: platform
  existingSecret: postgres-credentials
  createDevelopmentSecret: false
  password: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

ingress:
  host: platform.local

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

data:
  enabled: false
