apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: platform-api-read-config, namespace: {{ .Values.namespace }} }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: platform-api-read-config, namespace: {{ .Values.namespace }} }
subjects: [{ kind: ServiceAccount, name: platform-api, namespace: {{ .Values.namespace }} }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-api-read-config }
---
apiVersion: v1
kind: Secret
metadata: { name: postgres-credentials, namespace: {{ .Values.namespace }} }
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
