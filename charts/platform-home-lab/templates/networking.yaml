apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: platform, namespace: {{ .Values.namespace }} }
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8080 } } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: {{ .Values.namespace }} }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend-ingress, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-traffic, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: frontend } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres } } }, { podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-to-data, namespace: {{ .Values.namespace }} }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, redis] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }]
