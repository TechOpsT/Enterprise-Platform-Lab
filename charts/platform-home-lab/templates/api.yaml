apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: {{ .Values.namespace }}, labels: { app: api } }
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8080" }
    spec:
      serviceAccountName: platform-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_VERSION, value: {{ .Chart.AppVersion | quote }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: {{ .Values.namespace }}, labels: { app: api } }
spec: { selector: { app: api }, ports: [{ name: http, port: 8080, targetPort: 8080 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: {{ .Values.namespace }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} } } }]
