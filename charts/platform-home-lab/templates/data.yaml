{{- if .Values.data.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: {{ .Values.postgres.storage }} } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec: { clusterIP: None, selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: {{ .Values.namespace }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{ containerPort: 6379 }]
          securityContext: { runAsNonRoot: true, runAsUser: 999, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: {{ .Values.namespace }} }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
{{- end }}