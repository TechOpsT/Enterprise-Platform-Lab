apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: platform-api-alerts, namespace: monitoring }
spec:
  groups:
    - name: platform-api
      rules:
        - alert: PlatformAPIHighErrorRate
          expr: sum(rate(platform_api_requests_total{status=~"5.."}[5m])) / sum(rate(platform_api_requests_total[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Platform API error rate is above 5%" }
        - alert: PlatformAPIHighLatency
          expr: histogram_quantile(0.95, sum(rate(platform_api_request_duration_seconds_bucket[5m])) by (le)) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Platform API p95 latency exceeds 500ms" }
    - name: platform-backups
      rules:
        - alert: VeleroBackupFailed
          expr: increase(velero_backup_failure_total[1h]) > 0
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "A Velero backup failed during the last hour" }
        - alert: VeleroScheduledBackupStale
          expr: time() - max(velero_backup_last_successful_timestamp{schedule="platform-daily"}) > 93600
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "The daily platform backup is more than 26 hours old" }
